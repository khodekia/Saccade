[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saccade"
description = "Read PDF books on Linux with bionic-reading fixations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Kiavash" }]
keywords = ["pdf", "reader", "bionic", "speed-reading", "ebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing",
]
dynamic = ["version"]
dependencies = ["PyQt6>=6.5", "PyMuPDF>=1.23"]

[project.optional-dependencies]
pypdf = ["pypdf>=3.0"]

[project.scripts]
saccade = "saccade.app:main"

[project.urls]
Homepage = "https://github.com/khodekia/saccade"

[tool.setuptools.packages.find]
include = ["saccade*"]

[tool.setuptools.package-data]
saccade = ["assets/*.svg", "assets/wallets/*.svg"]

[tool.setuptools.dynamic]
version = { attr = "saccade.__version__" }
