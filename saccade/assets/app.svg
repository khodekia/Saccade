<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Darkish bluish background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing focal point gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Abstract Saccade / Bionic Reading Iconography -->
  <g transform="translate(0, 0)">
    <!-- Eye / Document Frame -->
    <path d="M 128 256 C 180 170, 332 170, 384 256 C 332 342, 180 342, 128 256 Z"
          fill="none"
          stroke="#334155"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Motion Saccade Line (Left to Focus Point) -->
    <line x1="160" y1="256" x2="220" y2="256"
          stroke="#475569"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="1 20" />

    <!-- Rapid Eye Movement / Bionic Focus Pupil -->
    <circle cx="256" cy="256" r="44" fill="url(#accent-grad)" />

    <!-- Bold Bionic Reading Anchor Point -->
    <circle cx="242" cy="256" r="16" fill="#ffffff" />

    <!-- Motion Saccade Line (Focus Point to Right) -->
    <path d="M 290 256 L 352 256"
          stroke="url(#accent-grad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="16 12" />

    <!-- Stylized Word Reading Lines below -->
    <!-- Line 1: Bold start (bionic focus), light tail -->
    <rect x="140" y="380" width="40" height="12" rx="6" fill="#38bdf8" />
    <rect x="188" y="380" width="60" height="12" rx="6" fill="#334155" />

    <rect x="264" y="380" width="50" height="12" rx="6" fill="#38bdf8" />
    <rect x="320" y="380" width="52" height="12" rx="6" fill="#334155" />
  </g>
</svg>
