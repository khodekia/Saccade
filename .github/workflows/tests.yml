name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version, and a current one.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install what Qt needs to start without a display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            fonts-dejavu-core fonts-liberation

      - name: Install Saccade
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Head-less checks that drive the real window
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/smoke_about.py
          python tools/smoke_gui.py --outdir "$RUNNER_TEMP/smoke"

      - name: Keep the screenshots the smoke test rendered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/smoke/*.png
          retention-days: 7
          if-no-files-found: ignore
